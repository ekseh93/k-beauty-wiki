name: Deploy AWS

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      AMPLIFY_GITHUB_TOKEN: ${{ secrets.AMPLIFY_GITHUB_TOKEN }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::490220201302:role/k-beauty-atlas-github-actions
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      - run: pnpm exec cdk bootstrap aws://490220201302/ap-northeast-1 --cloudformation-execution-policies arn:aws:iam::aws:policy/AdministratorAccess
      - run: pnpm exec cdk deploy --all --require-approval never
      - name: Start Amplify Hosting release
        id: amplify-release
        run: |
          job_id="$(aws amplify start-job --app-id d1ece7jdtq0bus --branch-name main --job-type RELEASE --query 'jobSummary.jobId' --output text)"
          echo "Amplify release job: $job_id"
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
      - name: Wait for Amplify Hosting release
        env:
          AMPLIFY_JOB_ID: ${{ steps.amplify-release.outputs.job_id }}
        run: |
          for attempt in {1..30}; do
            status="$(aws amplify get-job --app-id d1ece7jdtq0bus --branch-name main --job-id "$AMPLIFY_JOB_ID" --query 'job.summary.status' --output text)"
            echo "Amplify release status: $status"
            if [ "$status" = "SUCCEED" ]; then
              exit 0
            fi
            if [ "$status" = "FAILED" ] || [ "$status" = "CANCELLED" ]; then
              exit 1
            fi
            sleep 10
          done
          echo "Amplify release did not finish within the expected time."
          exit 1
